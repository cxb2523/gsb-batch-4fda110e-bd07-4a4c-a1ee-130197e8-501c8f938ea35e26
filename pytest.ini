[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Eigene event_loop-Fixture nötig, weil pytest-socket unter Windows den
    # Proactor-Loop (socketpair) blockiert (siehe tests/conftest.py).
    ignore:The event_loop fixture provided by pytest-asyncio has been redefined:DeprecationWarning
